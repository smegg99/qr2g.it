  value: Twórz, sprawdzaj i eksportuj linki przez curl, skrypty lub agentów.
  description: Text shown in docs / intro
contents:
  value: Na tej stronie
  description: Text shown in docs / contents
copy:
  value: Kopiuj polecenie
  description: Text shown in docs / copy
copied:
  value: Skopiowano
  description: Text shown in docs / copied
copyFailed:
  value: Nie udało się skopiować. Zaznacz polecenie i skopiuj je ręcznie.
  description: Text shown in docs / copyFailed
response:
  value: Przykładowa odpowiedź
  description: Text shown in docs / response
swagger:
  value: Otwórz interaktywną dokumentację API JSON
  description: Text shown in docs / swagger
short:
  title:
    value: Uzyskaj krótki link
    description: Text shown in docs / short / title
  text:
    value: 'Zastąp smegg99/qr2g.it parą właściciel/repozytorium. Znane repozytorium zwraca dotychczasowy adres. Nowe publiczne repozytorium otrzymuje adres po sprawdzeniu w GitHubie. Odpowiedź to zwykły tekst: URL zakończony znakiem nowej linii.'
    description: Text shown in docs / short / text
  explicit:
    value: 'curl jest rozpoznawany automatycznie. Dla innego klienta wyślij Accept: text/plain lub dodaj ?format=text. Otwarcie tej samej ścieżki repozytorium w przeglądarce przekieruje do krótkiego linku.'
    description: Text shown in docs / short / explicit
  sideEffects:
    value: "To skrócenie nie jest samym odczytem: dla repozytorium, którego qr2g.it jeszcze nie zna, sprawdza je na GitHubie i tworzy link (5 na godzinę na IP; operator może też wymagać sprawdzenia przeglądarki). Użyj endpointu lookup poniżej, gdy chcesz tylko odczytać."
    description: "Docs page text short.sideEffects"
  qr:
    value: "Dodaj ?qr, aby nad linkiem narysować kod QR znakami Unicode dla ciemnego terminala; ?qr=invert pasuje do jasnego. Ujmij adres w cudzysłów, aby powłoka nie interpretowała znaku ?."
    description: "Docs page text short.qr"
inspect:
  title:
    value: Odczytaj metadane
    description: Text shown in docs / inspect / title
  text:
    value: Odczytaj zapisane metadane bez kontaktu z GitHubem. Zastąp 2 swoim identyfikatorem linku. JSON zawiera pierwotną i bieżącą nazwę repozytorium, cel, stan i daty weryfikacji.
    description: Text shown in docs / inspect / text
  info:
    value: Znak plus po identyfikatorze zwraca te same metadane. Identyfikatory używają cyfr i wielkich liter systemu base36. Zachowaj wielkość liter.
    description: Text shown in docs / inspect / info
  lookup:
    value: "Znajdź istniejący link repozytorium bez tworzenia go i bez zapytania do GitHuba. Brak linku zwraca 404 link_not_found."
    description: "Docs page text inspect.lookup"
resolve:
  title:
    value: Sprawdź cel przekierowania
    description: Text shown in docs / resolve / title
  text:
    value: Endpoint resolve zwraca JSON i weryfikuje nieaktualne aktywne linki w GitHubie. Gdy weryfikacja jest niedostępna, zwraca błąd zamiast ufać nieaktualnemu celowi.
    description: Text shown in docs / resolve / text
  redirect:
    value: Aby sprawdzić zwykłe przekierowanie bez podążania za nim, wyświetl nagłówki odpowiedzi. Dodaj -L, jeśli curl ma podążać za przekierowaniami.
    description: Text shown in docs / resolve / redirect
create:
  title:
    value: Wyślij JSON
    description: Text shown in docs / create / title
  text:
    value: Wyślij POST z pełnym adresem HTTPS repozytorium GitHub. Powyższe polecenie skrótowe jest najprostszą opcją w terminalu.
    description: Text shown in docs / create / text
  verification:
    value: Żądania POST wymagają nowego tokenu Turnstile z weryfikacji w przeglądarce. Przypisz ten jednorazowy token do TURNSTILE_TOKEN.
    description: Text shown in docs / create / verification
  result:
    value: 'Odpowiedź jest w formacie JSON: 201 dla nowego linku lub 200 dla istniejącego. Nieznane, prywatne i nieprawidłowe repozytoria są odrzucane.'
    description: Text shown in docs / create / result
limits:
  title:
    value: Limity i błędy
    description: Text shown in docs / limits / title
  text:
    value: Limity dotyczą adresu IP. Poniżej podano wartości domyślne wdrożenia. Operator może skonfigurować inne.
    description: Text shown in docs / limits / text
  shorthand:
    value: 'Tworzenie linków do nowych repozytoriów przez ścieżkę skrótową: 5 na godzinę.'
    description: Text shown in docs / limits / shorthand
  post:
    value: 'POST: 3 żądania na minutę i 50 zgłoszeń na dobę po sprawdzeniu formatu URL. Nieudana weryfikacja zużywa limit dobowy.'
    description: Text shown in docs / limits / post
  known:
    value: Odczyt znanego repozytorium przez ścieżkę skrótową nie zużywa limitu tworzenia nowych linków.
    description: Text shown in docs / limits / known
  errors:
    value: Błędy zawierają stały kod i komunikat. Użyj --fail-with-body, aby zachować odpowiedź JSON i jednocześnie zakończyć curl kodem błędu. Ta opcja wymaga curl 7.76.0 lub nowszego.
    description: Text shown in docs / limits / errors
  statuses:
    value: Znaczenie odpowiedzi HTTP
    description: Text shown in docs / limits / statuses
  meaning:
    value: Znaczenie
    description: Text shown in docs / limits / meaning
status:
  '200':
    value: Istniejący link lub poprawna odpowiedź metadanych albo resolve.
    description: Text shown in docs / status / 200
  '201':
    value: Utworzono nowy link.
    description: Text shown in docs / status / 201
  '302':
    value: Przeglądarka lub krótki link są przekierowywane.
    description: Text shown in docs / status / 302
  '400':
    value: Treść JSON lub adres repozytorium są nieprawidłowe.
    description: Text shown in docs / status / 400
  '403':
    value: Repozytorium jest prywatne albo brakuje poprawnej weryfikacji Turnstile.
    description: Text shown in docs / status / 403
  '404':
    value: Nie znaleziono repozytorium lub krótkiego linku.
    description: Text shown in docs / status / 404
  '410':
    value: Zapisany link nie jest już aktywny.
    description: Text shown in docs / status / 410
  '429':
    value: Osiągnięto limit żądań dla Twojego IP.
    description: Text shown in docs / status / 429
  '503':
    value: GitHub, Turnstile lub weryfikacja repozytorium są tymczasowo niedostępne.
    description: Text shown in docs / status / 503
  '401':
    value: "Token automatyzacji jest wymagany, nieznany albo unieważniony."
    description: "Docs page text status.401"
automation:
  title:
    value: "Tokeny automatyzacji"
    description: "Docs page text automation.title"
  text:
    value: "Agenci i skrypty używają tokenu wydanego przez operatora zamiast sprawdzenia przeglądarki. Powtórzenie żądania zwraca ten sam link, więc ponawianie jest bezpieczne. Każda odpowiedź zawiera X-RateLimit-Limit, X-RateLimit-Remaining i X-RateLimit-Reset."
    description: "Docs page text automation.text"
  batch:
    value: "Utwórz lub użyj ponownie do 25 repozytoriów w jednym żądaniu. Każdy wpis ma własny wynik lub błąd i kosztuje jedną jednostkę limitu."
    description: "Docs page text automation.batch"
  quota:
    value: "Odczytaj dzisiejszy limit bez jego zużywania. Odpowiedź 429 quota_exceeded zawiera Retry-After do następnego dnia UTC."
    description: "Docs page text automation.quota"
assets:
  title:
    value: "Kody QR"
    description: "Docs page text assets.title"
  text:
    value: "Renderuj ten sam kod QR co strona, bez przeglądarki, jako SVG, PNG lub JPG. Logo qr2g.it jest domyślnie włączone; logo=false je pomija. API renderuje też szablony presentation, poster, label i badge."
    description: "Docs page text assets.text"
  reliability:
    value: "Kody mają margines czterech modułów, chyba że parametr margin ustawi od 0 do 16, i wymagają kontrastu co najmniej 4,5 między kodem a tłem; część starszych czytników odczytuje tylko ciemny kod na jasnym tle. Wygenerowany plik nie dowodzi, że każda drukarka czy aparat go odczyta; sprawdź gotowy wydruk."
    description: "Docs page text assets.reliability"
explore:
  title:
    value: "Widoczne repozytoria i statystyki"
    description: "Docs page text explore.title"
  text:
    value: "Przeszukuj widoczne repozytoria ze stronicowaniem. Pojawiają się tylko publiczne repozytoria zgłoszone do qr2g.it, których właściciel nie zrezygnował."
    description: "Docs page text explore.text"
  stats:
    value: "Odczytaj dzienne filtrowane przekierowania dla widocznego repozytorium. Nie obejmują żądań HEAD, rozpoznanych botów, podglądów ani ruchu API i nie są unikalnymi osobami."
    description: "Docs page text explore.stats"
  top:
    value: "Najczęściej odwiedzane widoczne repozytoria z ostatnich 30 dni, z dziennymi licznikami, sumą i czasem ostatniego zliczonego przekierowania. Strona główna pokazuje trzy pierwsze."
    description: "Docs page text explore.top"
prefill:
  title:
    value: "Linki z gotowym wyglądem"
    description: "Docs page text prefill.title"
  text:
    value: "Każdy czat lub dokument może prowadzić do qr2g.it z wypełnionym repozytorium i wyglądem. Otwarcie linku niczego nie tworzy; odwiedzający nadal klika Pobierz link."
    description: "Docs page text prefill.text"
  params:
    value: "Parametry: repo, fg, bg, logo, ec, margin, radius, size, transparent i format. Odpowiadają endpointowi assetów. Nieznane lub błędne wartości są pomijane i wymienione na stronie."
    description: "Docs page text prefill.params"
  honest:
    value: "Link z wyglądem nie jest krótkim linkiem. Nie wymyślaj identyfikatora i nie twierdź, że link istnieje, dopóki qr2g.it go nie pokaże."
    description: "Docs page text prefill.honest"
