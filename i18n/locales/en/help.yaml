intro:
  value: qr2g.it gives a public GitHub repository a stable address. When the repository is renamed or transferred, its short link can follow the same GitHub identity.
  description: Text shown in help / intro
howItWorks:
  title:
    value: How it works
    description: Text shown in help / howItWorks / title
  step1:
    value: Paste any public GitHub repository - owner/repo, github.com/owner/repo, or the full URL.
    description: Text shown in help / howItWorks / step1
  step2:
    value: We resolve it to GitHub's stable identity (the repo's GraphQL Node ID) and issue a short slug.
    description: Text shown in help / howItWorks / step2
  step3:
    value: If the repo is renamed or transferred later, the short link follows the new location automatically.
    description: Text shown in help / howItWorks / step3
