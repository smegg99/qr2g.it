errors:
  invalid_url:
    value: That isn't a valid public GitHub repository URL.
    description: Text shown in home / errors / invalid_url
  repo_private:
    value: This repository is private. qr2g.it only links to public repositories.
    description: Text shown in home / errors / repo_private
  repo_not_found:
    value: GitHub couldn't find that repository.
    description: Text shown in home / errors / repo_not_found
  rate_limited:
    value: Daily create limit reached. Try again later.
    description: Text shown in home / errors / rate_limited
  github_rate_limited:
    value: GitHub rate limit reached. Try again shortly.
    description: Text shown in home / errors / github_rate_limited
  github_unavailable:
    value: GitHub is temporarily unavailable.
    description: Text shown in home / errors / github_unavailable
  verification_failed:
    value: Couldn't verify the repository identity.
    description: Text shown in home / errors / verification_failed
  turnstile_required:
    value: Verification token missing.
    description: Text shown in home / errors / turnstile_required
  turnstile_failed:
    value: Verification failed.
    description: Text shown in home / errors / turnstile_failed
  turnstile_unavailable:
    value: Verification could not complete. Please try again.
    description: Text shown in home / errors / turnstile_unavailable
  internal:
    value: Something went wrong on our end.
    description: Text shown in home / errors / internal
  network:
    value: Network unreachable.
    description: Text shown in home / errors / network
  unknown:
    value: Unexpected error.
    description: Text shown in home / errors / unknown
metaTitle:
  value: qr2g.it - Permanent GitHub links
