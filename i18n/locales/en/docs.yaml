short:
  title:
    value: Get a short link
    description: Text shown in docs / short / title
  text:
    value: Replace smegg99/qr2g.it with owner/repo. A known repository returns its existing address; a new public repository gets one after a GitHub lookup. The response is a plain-text URL followed by a newline.
    description: Text shown in docs / short / text
  explicit:
    value: 'curl is recognized automatically. For another client, send Accept: text/plain or add ?format=text. Opening the same repository path in a browser redirects to its short link.'
    description: Text shown in docs / short / explicit
  sideEffects:
    value: "This shorthand is not a pure read: for a repository qr2g.it does not know yet, it verifies the repository on GitHub and creates its link (5 per hour per IP; the operator can also require a browser check). Use the lookup endpoint below when you only want to read."
    description: "Docs page text short.sideEffects"
  qr:
    value: "Add ?qr to draw the QR code above the link with Unicode blocks, for a dark terminal; ?qr=invert suits a light one. Quote the URL so the shell leaves the ? alone."
    description: "Docs page text short.qr"
inspect:
  title:
    value: Inspect a link
    description: Text shown in docs / inspect / title
  text:
    value: Read stored metadata without contacting GitHub. Replace 2 with your slug. The JSON includes the initial and current repository names, destination, state, and verification times.
    description: Text shown in docs / inspect / text
  info:
    value: A plus sign after the slug returns the same metadata. Slugs use uppercase base36; keep their case.
    description: Text shown in docs / inspect / info
  lookup:
    value: "Find the existing link of a repository without creating one and without a GitHub call. A missing link answers 404 link_not_found."
    description: "Docs page text inspect.lookup"
resolve:
  title:
    value: Check the destination
    description: Text shown in docs / resolve / title
  text:
    value: The resolve endpoint returns JSON and verifies stale active links against GitHub. If verification is unavailable, it returns an error instead of trusting an outdated destination.
    description: Text shown in docs / resolve / text
  redirect:
    value: To inspect the normal short-link redirect without following it, print its response headers. Add -L to curl when you want to follow redirects.
    description: Text shown in docs / resolve / redirect
create:
  title:
    value: Submit JSON
    description: Text shown in docs / create / title
  text:
    value: POST a complete HTTPS GitHub repository URL. The shorthand command above is the simplest option for terminal use.
    description: Text shown in docs / create / text
  verification:
    value: POST requests require a fresh Turnstile token from a browser challenge. Set TURNSTILE_TOKEN to that single-use token.
    description: Text shown in docs / create / verification
  result:
    value: 'The response is JSON: 201 for a newly created link or 200 for an existing one. Unknown, private, or invalid repositories are rejected.'
    description: Text shown in docs / create / result
limits:
  title:
    value: Limits and errors
    description: Text shown in docs / limits / title
  text:
    value: Limits apply per IP. These are the deployment defaults; an operator can configure different limits.
    description: Text shown in docs / limits / text
  shorthand:
    value: 'Creating a previously unknown repository through the shorthand route: 5 per hour.'
    description: Text shown in docs / limits / shorthand
  post:
    value: 'POST: 3 requests per minute and 50 submissions per day after URL validation. Failed verification counts toward the daily allowance.'
    description: Text shown in docs / limits / post
  known:
    value: Looking up an existing repository through the shorthand route does not use the cold-create allowance.
    description: Text shown in docs / limits / known
  errors:
    value: Errors contain a stable error code and a message. Use --fail-with-body to keep the JSON response while making curl exit with an error. This option requires curl 7.76.0 or newer.
    description: Text shown in docs / limits / errors
  statuses:
    value: HTTP response meanings
    description: Text shown in docs / limits / statuses
  meaning:
    value: Meaning
    description: Text shown in docs / limits / meaning
status:
  '200':
    value: Existing link or successful metadata/resolve response.
    description: Text shown in docs / status / 200
  '201':
    value: A new link was created.
    description: Text shown in docs / status / 201
  '302':
    value: A browser or short link is being redirected.
    description: Text shown in docs / status / 302
  '400':
    value: The JSON body or repository URL is invalid.
    description: Text shown in docs / status / 400
  '403':
    value: The repository is private, or Turnstile verification is missing or failed.
    description: Text shown in docs / status / 403
  '404':
    value: The repository or short link was not found.
    description: Text shown in docs / status / 404
  '410':
    value: The stored link is no longer active.
    description: Text shown in docs / status / 410
  '429':
    value: Your IP reached a request limit.
    description: Text shown in docs / status / 429
  '503':
    value: GitHub, Turnstile, or repository verification is temporarily unavailable.
    description: Text shown in docs / status / 503
  '401':
    value: "An automation token is required, unknown or revoked."
    description: "Docs page text status.401"
automation:
  title:
    value: "Automation tokens"
    description: "Docs page text automation.title"
  text:
    value: "Coding agents and scripts use a revocable token issued by the operator instead of the browser check. Repeating a creation request returns the same canonical link, so retries are safe. Every response carries X-RateLimit-Limit, X-RateLimit-Remaining and X-RateLimit-Reset."
    description: "Docs page text automation.text"
  batch:
    value: "Create or reuse up to 25 repositories in one request. Each entry has its own outcome or error and costs one unit of quota."
    description: "Docs page text automation.batch"
  quota:
    value: "Read today's quota without spending it. A 429 quota_exceeded answer carries Retry-After until the next UTC day."
    description: "Docs page text automation.quota"
assets:
  title:
    value: "QR codes"
    description: "Docs page text assets.title"
  text:
    value: "Render the same QR code as the website without a browser, as SVG, PNG or JPG. The qr2g.it logo is on by default; logo=false leaves it out. The API also renders presentation, poster, label and badge presets."
    description: "Docs page text assets.text"
  reliability:
    value: "Codes have a four-module quiet zone unless margin sets 0 to 16, and need a contrast of at least 4.5 between modules and tile; some older scanners read only dark-on-light codes. A rendered file does not prove that every printer or camera reads it; test the final output."
    description: "Docs page text assets.reliability"
explore:
  title:
    value: "Listed repositories and statistics"
    description: "Docs page text explore.title"
  text:
    value: "Search listed repositories with pagination. Only repositories submitted to qr2g.it that are public and not opted out appear."
    description: "Docs page text explore.text"
  stats:
    value: "Read daily filtered redirects for a listed repository. They exclude HEAD requests, identifiable bots, previews and API traffic, and are not unique people."
    description: "Docs page text explore.stats"
  top:
    value: "The most visited listed repositories over the last 30 days, with daily counts, their total and the time of the latest counted redirect. The home page shows the top three."
    description: "Docs page text explore.top"
prefill:
  title:
    value: "Prefilled design links"
    description: "Docs page text prefill.title"
  text:
    value: "Any chat or document can link to qr2g.it with a repository and design already filled in. Opening the link creates nothing; the visitor still presses Get link."
    description: "Docs page text prefill.text"
  params:
    value: "Parameters: repo, fg, bg, logo, ec, margin, radius, size, transparent and format. They match the asset endpoint. Unknown or invalid values are ignored and listed on the page."
    description: "Docs page text prefill.params"
  honest:
    value: "A design link is not a short link. Do not invent a slug or claim a link exists until qr2g.it shows it."
    description: "Docs page text prefill.honest"
