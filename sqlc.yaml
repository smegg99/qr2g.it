# sqlc config. The hand-written core/repositories package is the active data
# layer; this file lets you regenerate code from the queries with
# `sqlc generate` if you prefer codegen over hand-rolled pgx queries. The
# two paths are intentionally compatible.
version: "2"
sql:
  - schema: "core/datastore/migrations"
    queries: "core/datastore/queries"
    engine: "postgresql"
    gen:
      go:
        package: "sqlcgen"
        out: "core/repositories/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_enum_valid_method: false
        emit_all_enum_values: false
