# sqlc.yaml
# Optional query generation; core/repositories owns the active data layer.
version: "2"
sql:
  - schema: "core/datastore/migrations"
    queries: "core/datastore/queries"
    engine: "sqlite"
    gen:
      go:
        package: "sqlcgen"
        out: "core/repositories/sqlcgen"
        sql_package: "database/sql"
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_enum_valid_method: false
        emit_all_enum_values: false
