basePath: /
definitions:
  api.CreateLinkRequest:
    properties:
      turnstileToken:
        type: string
      url:
        type: string
    type: object
  api.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  api.LinkResponse:
    properties:
      createdAt:
        type: string
      currentFullName:
        type: string
      currentUrl:
        type: string
      githubDatabaseId:
        type: integer
      githubNodeId:
        type: string
      id:
        type: integer
      initialFullName:
        type: string
      slug:
        type: string
      state:
        type: string
      stateReason:
        type: string
      url:
        type: string
      verifiedAt:
        type: string
      verifyAfter:
        type: string
    type: object
info:
  contact: {}
  description: |-
    Permanent, QR-friendly short links for public GitHub repositories.
    Slugs are uppercase base36 of the link's id. Short URLs use the configured public origin.
  license:
    name: MIT
    url: https://github.com/smegg99/qr2g.it/blob/main/LICENSE
  title: qr2g.it API
  version: "1.0"
paths:
  /api/v1/links:
    post:
      consumes:
      - application/json
      description: |-
        Submits a public GitHub repository URL and returns its permanent short link.
        The same `node_id` always maps back to the same slug.
      parameters:
      - description: Public GitHub repository URL
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.CreateLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Existing link returned
          schema:
            $ref: '#/definitions/api.LinkResponse'
        "201":
          description: New link created
          schema:
            $ref: '#/definitions/api.LinkResponse'
        "400":
          description: Invalid body or URL
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Repository private or Turnstile failure
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Repository not found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "429":
          description: Per-IP rate limit reached
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "503":
          description: GitHub or Turnstile temporarily unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Create or reuse a short link
      tags:
      - links
  /api/v1/links/{slug}:
    get:
      description: Returns stored link metadata without performing GitHub verification.
      parameters:
      - description: Uppercase base36 slug, e.g. AB12
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.LinkResponse'
        "404":
          description: No such link
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get link metadata
      tags:
      - links
  /api/v1/links/{slug}/resolve:
    get:
      description: |-
        Verifies stale active links against GitHub and returns the post-verification state.
        Fails closed: a stale link is not advertised as active when verification fails.
      parameters:
      - description: Uppercase base36 slug, e.g. AB12
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Active link
          schema:
            $ref: '#/definitions/api.LinkResponse'
        "404":
          description: No such link
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "410":
          description: Tombstoned (private or deleted upstream)
          schema:
            $ref: '#/definitions/api.LinkResponse'
        "503":
          description: Verification temporarily unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Resolve a slug as JSON
      tags:
      - links
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - meta
  /ready:
    get:
      description: Pings SQLite with a 2s timeout.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness probe
      tags:
      - meta
schemes:
- http
- https
swagger: "2.0"
